name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:amirant
      - run: npm run qa:amirant-content
      - run: npm run security:preflight
      - run: npm run prod:readiness

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e:smoke
        env:
          CI: "1"
          # Deterministic smoke — no live Supabase/OpenAI required for lock checks
          NEXT_TELEMETRY_DISABLED: "1"
      # Playwright's webServer has just run `next build`, so the chunks are on
      # disk. Fails if answer keys or the lesson registry reach the browser bundle
      # again, or any single chunk goes over 600KB.
      - run: npm run check:client-chunks
